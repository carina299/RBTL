# Render Blueprint — deploys the backend as a persistent web service (SSE-friendly,
# unlike a serverless function) + a managed Postgres.
#
# Use it:
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo -> Apply.
#      (Or without a Blueprint: New -> Web Service -> Docker -> Root Directory =
#      "backend", plus a separate New -> PostgreSQL, and set the env vars below
#      by hand.)
#   3. After the frontend is deployed (Vercel), come back and set RELAY_ALLOW_ORIGINS
#      to its real URL, and set the frontend's RELAY_URL to this service's URL.
#
# The AI side (channel/ or examples/bridge_any_llm.py) is NOT part of this
# blueprint — it always runs on your own machine, pointed at this service's URL.

databases:
  - name: rbtl-db
    plan: free
    databaseName: rbtl
    user: rbtl

services:
  - type: web
    name: rbtl-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: RELAY_SECRET
        generateValue: true   # Render generates a strong random secret; copy it into the PWA login + channel/.env
      - key: DATABASE_URL
        fromDatabase:
          name: rbtl-db
          property: connectionString
      - key: RELAY_AI_NAME
        value: Claude
      - key: RELAY_HUMAN_NAME
        value: Your Name
      - key: RELAY_PUBLIC_PREFIX
        value: ""   # no nginx in front on Render — must stay empty, see backend/.env.example
      - key: RELAY_APP_PATH
        value: https://your-project.vercel.app/chat.html   # <- replace after deploying the frontend (where a push tap should open)
      - key: RELAY_ALLOW_ORIGINS
        value: https://your-project.vercel.app   # <- replace after deploying the frontend
      - key: RELAY_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: RELAY_VOICE_MAX_BYTES
        value: "8388608"
      - key: STORAGE_BACKEND
        value: local   # no MinIO in this blueprint; album files go to the container's own disk
      # Lock-screen push. Generate one keypair and keep it — changing it
      # invalidates every existing subscription on every device. `sync: false`
      # means "set this in the Render dashboard", so the private key never
      # lands in the repo.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_PEM
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    # Everything the relay writes to disk lives under /data, which is EPHEMERAL on
    # Render's free plan — it vanishes on every redeploy/restart. That means:
    #   - uploaded images/voice files disappear
    #   - album photos disappear (STORAGE_BACKEND=local writes there too)
    #   - relay.db disappears, and with it every **push subscription** — each
    #     device has to re-enable lock-screen push after a redeploy
    # Messages themselves are safe: those live in the managed Postgres above.
    # Uncomment on a paid plan that supports persistent disks:
    # disk:
    #   name: rbtl-data
    #   mountPath: /data
    #   sizeGB: 1
