# Config for the `web` container (nginx:alpine). Mounted over the image's own
# conf.d/default.conf by docker-compose.
#
# This fronts BOTH halves on one origin:
#   /        -> the static frontend in frontend/
#   /relay/  -> the relay container on :3011
#
# One origin means zero CORS: the page and the API answer on the same host, so
# the browser never sends a cross-origin request. It also matches the shape in
# backend/nginx-companion.conf.example, so a VPS deploy behaves identically.
#
# Moving to split origins later (frontend on Vercel, relay on Render) needs no
# change here — the frontend just gets an explicit Relay URL in chat settings.

server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # API — reverse proxy to the relay. The trailing slash on proxy_pass strips
    # the /relay/ prefix, which is why RELAY_PUBLIC_PREFIX must be /relay: the
    # backend builds attachment and album URLs with it so they resolve here.
    #
    # Note: nginx resolves `backend` once at startup. If the relay container is
    # recreated and lands on a new IP, this starts 502-ing — `docker compose
    # restart web` fixes it.
    location /relay/ {
        proxy_pass http://backend:3011/;
        client_max_body_size 10m;             # must be >= RELAY_MAX_UPLOAD_BYTES

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: without these the /app/stream and /channel/in streams get buffered
        # and the app "connects but never receives anything" (AGENTS.md pitfall #3).
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Deliberately NOT `chunked_transfer_encoding off`, which the VPS example
        # in backend/nginx-companion.conf.example uses. Without chunking, a
        # streamed response has neither a length nor frame boundaries and is
        # delimited only by the connection closing — fine when nginx talks
        # straight to the browser, but any proxy sitting in front then has to
        # buffer the whole response to find its end, and the SSE stream silently
        # never arrives.
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's bundled mime.types has no entry for .webmanifest, so without this
    # the manifest goes out as application/octet-stream and browsers refuse to
    # treat it as one — no Add to Home Screen, and therefore no push on iOS.
    # `default_type` only fills in where the types map came up empty.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The service worker must never be served stale: a cached copy keeps an old
    # worker (and its old cache strategy) alive across deploys.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
